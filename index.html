                                                                    <path
                                                                        key={tier}
                                                                        d={`M16,16 L${x1},${y1} A16,16 0 ${largeArc},1 ${x2},${y2} Z`}
                                                                        fill={colors[tier]}
                                                                    />
                                                                );
                                                            })}
                                                        </svg>
                                                        <div>
                                                            {entries.map(([tier, count]) => (
                                                                <div key={tier} style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' }}>
                                                                    <div style={{ width: '12px', height: '12px', borderRadius: '2px', background: colors[tier] }}></div>
                                                                    <span>{tier}: <strong>{count}</strong> ({((count/total)*100).toFixed(1)}%)</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            
                                            // Bar chart (default)
                                            return (
                                                <div style={{ width: '100%' }}>
                                                    {Object.entries(data).map(([tier, count]) => (
                                                        <div key={tier} style={{ marginBottom: '15px' }}>
                                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
                                                                <span>{tier}</span>
                                                                <span><strong>{count}</strong> ({((count/total)*100).toFixed(1)}%)</span>
                                                            </div>
                                                            <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '24px', overflow: 'hidden' }}>
                                                                <div style={{ background: colors[tier], height: '100%', width: `${(count/total)*100}%`, borderRadius: '4px' }}></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>

                                {/* Breed Level Distribution */}
                                <div className="chart-container">
                                    <h4 style={{ marginTop: 0, color: '#333' }}>Breed Level Distribution</h4>
                                    <div style={{ height: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                        {(() => {
                                            const data = getLevelChartData();
                                            const total = Object.values(data).reduce((a, b) => a + b, 0);
                                            if (total === 0) return <p style={{ color: '#666' }}>No data yet</p>;
                                            
                                            const colors = { 'Level 1': '#3b82f6', 'Level 2': '#f59e0b', 'Level 3': '#ef4444', 'Unknown': '#9ca3af' };
                                            
                                            if (chartType === 'pie') {
                                                // Pie chart
                                                const entries = Object.entries(data).filter(([_, count]) => count > 0);
                                                let cumulativePercent = 0;
                                                
                                                return (
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '30px' }}>
                                                        <svg width="150" height="150" viewBox="0 0 32 32">
                                                            {entries.map(([level, count], i) => {
                                                                const percent = (count / total) * 100;
                                                                const startAngle = cumulativePercent * 3.6 * (Math.PI / 180);
                                                                cumulativePercent += percent;
                                                                const endAngle = cumulativePercent * 3.6 * (Math.PI / 180);
                                                                
                                                                const x1 = 16 + 16 * Math.sin(startAngle);
                                                                const y1 = 16 - 16 * Math.cos(startAngle);
                                                                const x2 = 16 + 16 * Math.sin(endAngle);
                                                                const y2 = 16 - 16 * Math.cos(endAngle);
                                                                const largeArc = percent > 50 ? 1 : 0;
                                                                
                                                                return (
                                                                    <path
                                                                        key={level}
                                                                        d={`M16,16 L${x1},${y1} A16,16 0 ${largeArc},1 ${x2},${y2} Z`}
                                                                        fill={colors[level]}
                                                                    />
                                                                );
                                                            })}
                                                        </svg>
                                                        <div>
                                                            {entries.map(([level, count]) => (
                                                                <div key={level} style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px' }}>
                                                                    <div style={{ width: '12px', height: '12px', borderRadius: '2px', background: colors[level] }}></div>
                                                                    <span>{level}: <strong>{count}</strong> ({((count/total)*100).toFixed(1)}%)</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            
                                            // Bar chart (default)
                                            return (
                                                <div style={{ width: '100%' }}>
                                                    {Object.entries(data).filter(([_, count]) => count > 0).map(([level, count]) => (
                                                        <div key={level} style={{ marginBottom: '15px' }}>
                                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
                                                                <span>{level}</span>
                                                                <span><strong>{count}</strong> ({((count/total)*100).toFixed(1)}%)</span>
                                                            </div>
                                                            <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '24px', overflow: 'hidden' }}>
                                                                <div style={{ background: colors[level], height: '100%', width: `${(count/total)*100}%`, borderRadius: '4px' }}></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>

                                {/* Team Performance */}
                                <div className="chart-container">
                                    <h4 style={{ marginTop: 0, color: '#333' }}>Team Performance</h4>
                                    <div style={{ height: '300px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                        {(() => {
                                            const data = getTeamChartData();
                                            if (data.labels.length === 0) return <p style={{ color: '#666' }}>No data yet</p>;
                                            
                                            const maxSignups = Math.max(...data.signups);
                                            return (
                                                <div style={{ width: '100%' }}>
                                                    {data.labels.map((name, i) => (
                                                        <div key={name} style={{ marginBottom: '15px' }}>
                                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
                                                                <span>{name}</span>
                                                                <span><strong>{data.signups[i]}</strong> sign-ups (${data.mrr[i]} MRR)</span>
                                                            </div>
                                                            <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '24px', overflow: 'hidden' }}>
                                                                <div style={{ background: '#0077B6', height: '100%', width: `${(data.signups[i]/maxSignups)*100}%`, borderRadius: '4px' }}></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>

                                {/* Reg Fees */}
                                <div className="chart-container">
                                    <h4 style={{ marginTop: 0, color: '#333' }}>Registration Fees</h4>
                                    <div style={{ height: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                        {(() => {
                                            const allSignups = getAllSignups();
                                            const collected = allSignups.filter(s => s.regFeeCollected).length;
                                            const waived = allSignups.filter(s => !s.regFeeCollected).length;
                                            const total = collected + waived;
                                            
                                            if (total === 0) return <p style={{ color: '#666' }}>No data yet</p>;
                                            
                                            return (
                                                <div style={{ width: '100%' }}>
                                                    <div style={{ marginBottom: '15px' }}>
                                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
                                                            <span>✅ Collected</span>
                                                            <span><strong>{collected}</strong> (${collected * 30})</span>
                                                        </div>
                                                        <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '24px', overflow: 'hidden' }}>
                                                            <div style={{ background: '#22c55e', height: '100%', width: `${(collected/total)*100}%`, borderRadius: '4px' }}></div>
                                                        </div>
                                                    </div>
                                                    <div style={{ marginBottom: '15px' }}>
                                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
                                                            <span>⏭️ Waived</span>
                                                            <span><strong>{waived}</strong></span>
                                                        </div>
                                                        <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '24px', overflow: 'hidden' }}>
                                                            <div style={{ background: '#9ca3af', height: '100%', width: `${(waived/total)*100}%`, borderRadius: '4px' }}></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>
                            </div>

                            {/* Individual Team Member Stats */}
                            <div className="chart-container" style={{ marginTop: '20px' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px', flexWrap: 'wrap', gap: '10px' }}>
                                    <h4 style={{ margin: 0, color: '#333' }}>👤 Individual Team Member Stats</h4>
                                    <select
                                        className="filter-input"
                                        value={selectedTeamMember}
                                        onChange={(e) => setSelectedTeamMember(e.target.value)}
                                        style={{ minWidth: '200px' }}
                                    >
                                        <option value="">Select a team member...</option>
                                        {getUniqueTeamMembers().map(m => (
                                            <option key={m} value={m}>{m}</option>
                                        ))}
                                    </select>
                                </div>
                                
                                {selectedTeamMember ? (
                                    (() => {
                                        const stats = getTeamMemberStats(selectedTeamMember);
                                        if (!stats || stats.totalSignups === 0) {
                                            return <p style={{ color: '#666', textAlign: 'center' }}>No sign-ups found for {selectedTeamMember}</p>;
                                        }
                                        
                                        const tierColors = { 'Escentials': '#3b82f6', 'Escentials+': '#f59e0b', 'Unlimited +': '#22c55e' };
                                        const levelColors = { 'Level 1': '#3b82f6', 'Level 2': '#f59e0b', 'Level 3': '#ef4444', 'Unknown': '#9ca3af' };
                                        
                                        return (
                                            <div>
                                                {/* Summary Stats */}
                                                <div style={{ display: 'flex', gap: '20px', marginBottom: '25px', flexWrap: 'wrap' }}>
                                                    <div style={{ background: '#f0f9ff', padding: '15px 20px', borderRadius: '8px', textAlign: 'center' }}>
                                                        <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#0077B6' }}>{stats.totalSignups}</div>
                                                        <div style={{ fontSize: '0.85em', color: '#666' }}>Total Sign-ups</div>
                                                    </div>
                                                    <div style={{ background: '#fff7ed', padding: '15px 20px', borderRadius: '8px', textAlign: 'center' }}>
                                                        <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#FF6B35' }}>{stats.uniqueMembers}</div>
                                                        <div style={{ fontSize: '0.85em', color: '#666' }}>Unique Members</div>
                                                    </div>
                                                    <div style={{ background: '#f0fdf4', padding: '15px 20px', borderRadius: '8px', textAlign: 'center' }}>
                                                        <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#22c55e' }}>${stats.totalMRR}</div>
                                                        <div style={{ fontSize: '0.85em', color: '#666' }}>Monthly MRR</div>
                                                    </div>
                                                    <div style={{ background: '#faf5ff', padding: '15px 20px', borderRadius: '8px', textAlign: 'center' }}>
                                                        <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#8b5cf6' }}>{stats.regFeesCollected}</div>
                                                        <div style={{ fontSize: '0.85em', color: '#666' }}>Reg Fees Collected</div>
                                                    </div>
                                                </div>
                                                
                                                {/* Charts Grid */}
                                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px' }}>
                                                    {/* Tier Breakdown */}
                                                    <div style={{ background: '#f8fafc', padding: '15px', borderRadius: '8px' }}>
                                                        <h5 style={{ margin: '0 0 15px 0', color: '#333' }}>Tier Breakdown</h5>
                                                        {chartType === 'pie' ? (
                                                            (() => {
                                                                const entries = Object.entries(stats.tiers).filter(([_, count]) => count > 0);
                                                                const total = entries.reduce((sum, [_, count]) => sum + count, 0);
                                                                if (total === 0) return <p style={{ color: '#666' }}>No data</p>;
                                                                
                                                                let cumulativePercent = 0;
                                                                return (
                                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
                                                                        <svg width="100" height="100" viewBox="0 0 32 32">
                                                                            {entries.map(([tier, count]) => {
                                                                                const percent = (count / total) * 100;
                                                                                const startAngle = cumulativePercent * 3.6 * (Math.PI / 180);
                                                                                cumulativePercent += percent;
                                                                                const endAngle = cumulativePercent * 3.6 * (Math.PI / 180);
                                                                                const x1 = 16 + 16 * Math.sin(startAngle);
                                                                                const y1 = 16 - 16 * Math.cos(startAngle);
                                                                                const x2 = 16 + 16 * Math.sin(endAngle);
                                                                                const y2 = 16 - 16 * Math.cos(endAngle);
                                                                                const largeArc = percent > 50 ? 1 : 0;
                                                                                return <path key={tier} d={`M16,16 L${x1},${y1} A16,16 0 ${largeArc},1 ${x2},${y2} Z`} fill={tierColors[tier]} />;
                                                                            })}
                                                                        </svg>
                                                                        <div style={{ fontSize: '0.85em' }}>
                                                                            {entries.map(([tier, count]) => (
                                                                                <div key={tier} style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '4px' }}>
                                                                                    <div style={{ width: '10px', height: '10px', borderRadius: '2px', background: tierColors[tier] }}></div>
                                                                                    <span>{tier}: {count}</span>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })()
                                                        ) : (
                                                            <div>
                                                                {Object.entries(stats.tiers).map(([tier, count]) => {
                                                                    const total = Object.values(stats.tiers).reduce((a, b) => a + b, 0);
                                                                    return (
                                                                        <div key={tier} style={{ marginBottom: '10px' }}>
                                                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85em', marginBottom: '3px' }}>
                                                                                <span>{tier}</span>
                                                                                <span>{count}</span>
                                                                            </div>
                                                                            <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '16px', overflow: 'hidden' }}>
                                                                                <div style={{ background: tierColors[tier], height: '100%', width: total > 0 ? `${(count/total)*100}%` : '0%', borderRadius: '4px' }}></div>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    {/* Level Breakdown */}
                                                    <div style={{ background: '#f8fafc', padding: '15px', borderRadius: '8px' }}>
                                                        <h5 style={{ margin: '0 0 15px 0', color: '#333' }}>Breed Level Breakdown</h5>
                                                        {chartType === 'pie' ? (
                                                            (() => {
                                                                const entries = Object.entries(stats.levels).filter(([_, count]) => count > 0);
                                                                const total = entries.reduce((sum, [_, count]) => sum + count, 0);
                                                                if (total === 0) return <p style={{ color: '#666' }}>No data</p>;
                                                                
                                                                let cumulativePercent = 0;
                                                                return (
                                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
                                                                        <svg width="100" height="100" viewBox="0 0 32 32">
                                                                            {entries.map(([level, count]) => {
                                                                                const percent = (count / total) * 100;
                                                                                const startAngle = cumulativePercent * 3.6 * (Math.PI / 180);
                                                                                cumulativePercent += percent;
                                                                                const endAngle = cumulativePercent * 3.6 * (Math.PI / 180);
                                                                                const x1 = 16 + 16 * Math.sin(startAngle);
                                                                                const y1 = 16 - 16 * Math.cos(startAngle);
                                                                                const x2 = 16 + 16 * Math.sin(endAngle);
                                                                                const y2 = 16 - 16 * Math.cos(endAngle);
                                                                                const largeArc = percent > 50 ? 1 : 0;
                                                                                return <path key={level} d={`M16,16 L${x1},${y1} A16,16 0 ${largeArc},1 ${x2},${y2} Z`} fill={levelColors[level]} />;
                                                                            })}
                                                                        </svg>
                                                                        <div style={{ fontSize: '0.85em' }}>
                                                                            {entries.map(([level, count]) => (
                                                                                <div key={level} style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '4px' }}>
                                                                                    <div style={{ width: '10px', height: '10px', borderRadius: '2px', background: levelColors[level] }}></div>
                                                                                    <span>{level}: {count}</span>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })()
                                                        ) : (
                                                            <div>
                                                                {Object.entries(stats.levels).filter(([_, count]) => count > 0).map(([level, count]) => {
                                                                    const total = Object.values(stats.levels).reduce((a, b) => a + b, 0);
                                                                    return (
                                                                        <div key={level} style={{ marginBottom: '10px' }}>
                                                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85em', marginBottom: '3px' }}>
                                                                                <span>{level}</span>
                                                                                <span>{count}</span>
                                                                            </div>
                                                                            <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '16px', overflow: 'hidden' }}>
                                                                                <div style={{ background: levelColors[level], height: '100%', width: total > 0 ? `${(count/total)*100}%` : '0%', borderRadius: '4px' }}></div>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    {/* Reg Fees */}
                                                    <div style={{ background: '#f8fafc', padding: '15px', borderRadius: '8px' }}>
                                                        <h5 style={{ margin: '0 0 15px 0', color: '#333' }}>Registration Fees</h5>
                                                        <div>
                                                            <div style={{ marginBottom: '10px' }}>
                                                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85em', marginBottom: '3px' }}>
                                                                    <span>✅ Collected</span>
                                                                    <span>{stats.regFeesCollected} (${stats.regFeesCollected * 30})</span>
                                                                </div>
                                                                <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '16px', overflow: 'hidden' }}>
                                                                    <div style={{ background: '#22c55e', height: '100%', width: stats.totalSignups > 0 ? `${(stats.regFeesCollected/stats.totalSignups)*100}%` : '0%', borderRadius: '4px' }}></div>
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85em', marginBottom: '3px' }}>
                                                                    <span>⏭️ Waived</span>
                                                                    <span>{stats.regFeesWaived}</span>
                                                                </div>
                                                                <div style={{ background: '#e5e7eb', borderRadius: '4px', height: '16px', overflow: 'hidden' }}>
                                                                    <div style={{ background: '#9ca3af', height: '100%', width: stats.totalSignups > 0 ? `${(stats.regFeesWaived/stats.totalSignups)*100}%` : '0%', borderRadius: '4px' }}></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()
                                ) : (
                                    <p style={{ color: '#666', textAlign: 'center', padding: '30px' }}>Select a team member above to see their individual stats</p>
                                )}
                            </div>

                            {/* Progress Over Time */}
                            <div className="chart-container" style={{ marginTop: '20px' }}>
                                <h4 style={{ marginTop: 0, color: '#333' }}>📈 Progress Over Time</h4>
                                <div style={{ height: '200px', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-around', padding: '20px 0' }}>
                                    {(() => {
                                        const data = getProgressOverTime();
                                        if (data.length === 0) return <p style={{ color: '#666' }}>No data yet</p>;
                                        
                                        const maxCount = Math.max(...data.map(d => d.count), goal);
                                        return data.slice(-14).map((d, i) => (
                                            <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1 }}>
                                                <div style={{ fontSize: '0.75em', marginBottom: '5px' }}>{d.count}</div>
                                                <div style={{ 
                                                    background: d.count >= goal ? '#22c55e' : '#0077B6', 
                                                    width: '100%', 
                                                    maxWidth: '30px',
                                                    height: `${(d.count / maxCount) * 150}px`,
                                                    borderRadius: '4px 4px 0 0',
                                                    minHeight: '5px'
                                                }}></div>
                                                <div style={{ fontSize: '0.65em', marginTop: '5px', transform: 'rotate(-45deg)', whiteSpace: 'nowrap' }}>
                                                    {d.date.slice(5)}
                                                </div>
                                            </div>
                                        ));
                                    })()}
                                </div>
                                <div style={{ textAlign: 'center', color: '#666', fontSize: '0.85em' }}>
                                    Goal line: {goal} sign-ups
                                </div>
                            </div>

                            {/* Generate Report Section */}
                            <div className="report-box" style={{ marginTop: '30px' }}>
                                <h4 style={{ marginTop: 0, color: '#0077B6' }}>📋 Generate Report</h4>
                                <div style={{ display: 'flex', gap: '15px', flexWrap: 'wrap', marginBottom: '20px' }}>
                                    <div className="filter-group">
                                        <label>Date Range</label>
                                        <select
                                            className="filter-input"
                                            value={reportDateRange}
                                            onChange={(e) => setReportDateRange(e.target.value)}
                                        >
                                            <option value="thisWeek">This Week</option>
                                            <option value="lastWeek">Last Week</option>
                                            <option value="thisMonth">This Month</option>
                                            <option value="lastMonth">Last Month</option>
                                            <option value="custom">Custom Range</option>
                                        </select>
                                    </div>
                                    {reportDateRange === 'custom' && (
                                        <>
                                            <div className="filter-group">
                                                <label>From</label>
                                                <input
                                                    type="date"
                                                    className="filter-input"
                                                    value={reportFromDate}
                                                    onChange={(e) => setReportFromDate(e.target.value)}
                                                />
                                            </div>
                                            <div className="filter-group">
                                                <label>To</label>
                                                <input
                                                    type="date"
                                                    className="filter-input"
                                                    value={reportToDate}
                                                    onChange={(e) => setReportToDate(e.target.value)}
                                                />
                                            </div>
                                        </>
                                    )}
                                    <div className="filter-group">
                                        <label>&nbsp;</label>
                                        <button onClick={copyReportToClipboard} className="btn">
                                            📋 Copy Report to Clipboard
                                        </button>
                                    </div>
                                </div>
                                <div className="report-summary">
                                    {generateReport()}
                                </div>
                            </div>
                        </div>
                    )}

                    <div style={{ textAlign: 'center', padding: '40px 20px', color: '#0077B6', marginTop: '40px' }}>
                        <span style={{ color: '#FF6B35', fontSize: '1.5em' }}>🐾</span>
                        <strong> SCENTHOUND SHERWOOD</strong> - Coming Soon!
                        <span style={{ color: '#FF6B35', fontSize: '1.5em' }}> 🐾</span>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PreSalesTracker />, document.getElementById('root'));
    </script>
</body>
</html>
