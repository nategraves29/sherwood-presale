    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Scenthound Breed Database with Levels
        const breedDatabase = [
            // Level 1 Breeds
            { name: 'American Bulldog', level: 1 },
            { name: 'Australian Cattle Dog', level: 1 },
            { name: 'American Pit Bull Terrier', level: 1 },
            { name: 'Basset Hound', level: 1 },
            { name: 'Beagle', level: 1 },
            { name: 'Bichon Frise', level: 1 },
            { name: 'Black Mouth Cur', level: 1 },
            { name: 'Boston Terrier', level: 1 },
            { name: 'Boxer', level: 1 },
            { name: 'Bull Terrier', level: 1 },
            { name: 'Cavalier King Charles Spaniel', level: 1 },
            { name: 'Chihuahua (Long-haired)', level: 1 },
            { name: 'Chihuahua (Short-haired)', level: 1 },
            { name: 'Cocker Spaniel', level: 1 },
            { name: 'Dachshund (Long-haired)', level: 1 },
            { name: 'Dachshund (Short-haired)', level: 1 },
            { name: 'Doberman Pinscher', level: 1 },
            { name: 'Doodle (Toy)', level: 1 },
            { name: 'English Bulldog', level: 1 },
            { name: 'French Bulldog', level: 1 },
            { name: 'German Shorthaired Pointer', level: 1 },
            { name: 'Havanese', level: 1 },
            { name: 'Jack Russell Terrier', level: 1 },
            { name: 'Maltese', level: 1 },
            { name: 'Miniature Pinscher', level: 1 },
            { name: 'Pomeranian', level: 1 },
            { name: 'Poodle (Toy)', level: 1 },
            { name: 'Pug', level: 1 },
            { name: 'Schnauzer (Mini)', level: 1 },
            { name: 'Shiba Inu', level: 1 },
            { name: 'Shih Tzu', level: 1 },
            { name: 'Welsh Corgi', level: 1 },
            { name: 'Yorkshire Terrier', level: 1 },
            // Level 2 Breeds
            { name: 'Australian Shepherd', level: 2 },
            { name: 'Belgian Malinois', level: 2 },
            { name: 'Belgian Tervuren', level: 2 },
            { name: 'Border Collie', level: 2 },
            { name: 'Cane Corso', level: 2 },
            { name: 'Doodle (Mini)', level: 2 },
            { name: 'German Shepherd', level: 2 },
            { name: 'Golden Retriever', level: 2 },
            { name: 'Great Dane', level: 2 },
            { name: 'Irish Setter', level: 2 },
            { name: 'English Setter', level: 2 },
            { name: 'Labrador Retriever', level: 2 },
            { name: 'Mastiff', level: 2 },
            { name: 'Poodle (Mini/Moyen)', level: 2 },
            { name: 'Portuguese Water Dog', level: 2 },
            { name: 'Rottweiler', level: 2 },
            { name: 'Schnauzer (Standard)', level: 2 },
            { name: 'Siberian Husky', level: 2 },
            // Level 3 Breeds
            { name: 'Doodle (Standard)', level: 3 },
            { name: 'Goldendoodle', level: 3 },
            { name: 'Labradoodle', level: 3 },
            { name: 'Great Pyrenees', level: 3 },
            { name: 'Irish Wolfhound', level: 3 },
            { name: 'Malamute', level: 3 },
            { name: 'Old English Sheepdog', level: 3 },
            { name: 'Poodle (Standard)', level: 3 },
            { name: 'Schnauzer (Giant)', level: 3 },
            { name: 'St. Bernard', level: 3 },
            { name: 'Wooly Husky', level: 3 },
        ].sort((a, b) => a.name.localeCompare(b.name));

        // Breed Autocomplete Component
        const BreedAutocomplete = ({ value, onChange, onLevelChange }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState(value || '');
            const [highlightedIndex, setHighlightedIndex] = useState(0);
            const inputRef = useRef(null);
            const dropdownRef = useRef(null);

            const filteredBreeds = breedDatabase.filter(breed =>
                breed.name.toLowerCase().includes(search.toLowerCase())
            );

            useEffect(() => {
                setSearch(value || '');
            }, [value]);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target) &&
                        inputRef.current && !inputRef.current.contains(e.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const selectBreed = (breed) => {
                setSearch(breed.name);
                onChange(breed.name);
                if (onLevelChange) onLevelChange(breed.level);
                setIsOpen(false);
            };

            const handleInputChange = (e) => {
                const val = e.target.value;
                setSearch(val);
                onChange(val);
                setIsOpen(true);
                setHighlightedIndex(0);
                
                // Check if it matches a breed and update level
                const matchedBreed = breedDatabase.find(b => 
                    b.name.toLowerCase() === val.toLowerCase()
                );
                if (matchedBreed && onLevelChange) {
                    onLevelChange(matchedBreed.level);
                } else if (onLevelChange) {
                    onLevelChange(null);
                }
            };

            const handleKeyDown = (e) => {
                if (!isOpen) {
                    if (e.key === 'ArrowDown' || e.key === 'Enter') {
                        setIsOpen(true);
                    }
                    return;
                }

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setHighlightedIndex(prev => 
                        prev < filteredBreeds.length - 1 ? prev + 1 : prev
                    );
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setHighlightedIndex(prev => prev > 0 ? prev - 1 : 0);
                } else if (e.key === 'Enter' && filteredBreeds.length > 0) {
                    e.preventDefault();
                    selectBreed(filteredBreeds[highlightedIndex]);
                } else if (e.key === 'Escape') {
                    setIsOpen(false);
                }
            };

            const getLevelBadgeClass = (level) => {
                if (level === 1) return 'level-1';
                if (level === 2) return 'level-2';
                return 'level-3';
            };

            return (
                <div className="breed-autocomplete">
                    <input
                        ref={inputRef}
                        type="text"
                        value={search}
                        onChange={handleInputChange}
                        onFocus={() => setIsOpen(true)}
                        onKeyDown={handleKeyDown}
                        className="form-input"
                        placeholder="Start typing breed..."
                        autoComplete="off"
                    />
                    {isOpen && filteredBreeds.length > 0 && (
                        <div className="breed-dropdown" ref={dropdownRef}>
                            {filteredBreeds.map((breed, index) => (
                                <div
                                    key={breed.name}
                                    className={`breed-option ${index === highlightedIndex ? 'selected' : ''}`}
                                    onClick={() => selectBreed(breed)}
                                    onMouseEnter={() => setHighlightedIndex(index)}
                                >
                                    <span>{breed.name}</span>
                                    <span className={`level-badge ${getLevelBadgeClass(breed.level)}`}>
                                        Level {breed.level}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const PreSalesTracker = () => {
            const [entries, setEntries] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('dashboard');
            const [userName, setUserName] = useState(() => localStorage.getItem('presalesUserName') || '');
            const [editingEntry, setEditingEntry] = useState(null);
            const [leaderboardMetric, setLeaderboardMetric] = useState('signups');
            const [deletedEntries, setDeletedEntries] = useState([]);
            const [showUndoToast, setShowUndoToast] = useState(false);
            const fileInputRef = React.useRef(null);
            
            // Goal and opening date settings
            const [goal, setGoal] = useState(() => {
                const saved = localStorage.getItem('presalesGoal');
                return saved ? parseInt(saved) : 250;
            });
            const [openingDate, setOpeningDate] = useState(() => {
                return localStorage.getItem('presalesOpeningDate') || '';
            });
            const [showSettings, setShowSettings] = useState(false);

            const tierPricing = {
                'Escentials': 29,
                'Escentials+': 39,
                'Unlimited +': 59
            };

            const emptySignup = {
                memberName: '',
                phone: '',
                email: '',
                dogName: '',
                dogBreed: '',
                dogBreedLevel: null,
                tier: 'Escentials',
                myTimeLink: ''
            };

            const [currentEntry, setCurrentEntry] = useState({
                date: new Date().toISOString().split('T')[0],
                teamMember: '',
                signups: [{ ...emptySignup }],
                dailyReport: ''
            });

            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseDB) {
                        clearInterval(checkFirebase);
                        loadEntriesFromFirebase();
                    }
                }, 100);
                
                return () => clearInterval(checkFirebase);
            }, []);

            const loadEntriesFromFirebase = async () => {
                try {
                    const entriesCol = window.firestoreCollection(window.firebaseDB, 'presales_entries');
                    const snapshot = await window.firestoreGetDocs(entriesCol);
                    const entriesData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setEntries(entriesData.sort((a, b) => new Date(b.date) - new Date(a.date)));
                } catch (error) {
                    console.error('Error loading entries:', error);
                } finally {
                    setLoading(false);
                }
            };

            const addSignupRow = () => {
                setCurrentEntry(prev => ({
                    ...prev,
                    signups: [...prev.signups, { ...emptySignup }]
                }));
            };

            const removeSignupRow = (index) => {
                if (currentEntry.signups.length > 1) {
                    setCurrentEntry(prev => ({
                        ...prev,
                        signups: prev.signups.filter((_, i) => i !== index)
                    }));
                }
            };

            const updateSignup = (index, field, value) => {
                setCurrentEntry(prev => ({
                    ...prev,
                    signups: prev.signups.map((signup, i) => 
                        i === index ? { ...signup, [field]: value } : signup
                    )
                }));
            };

            const saveEntry = async () => {
                // Validate team member name
                const teamMemberName = currentEntry.teamMember?.trim() || userName?.trim();
                if (!teamMemberName) {
                    alert('Please enter your name in the "Your Name" field.');
                    return;
                }

                // Validate each signup has all required fields
                const missingFields = [];
                const validSignups = [];
                
                currentEntry.signups.forEach((signup, index) => {
                    const signupMissing = [];
                    const signupNum = index + 1;
                    
                    if (!signup.memberName?.trim()) signupMissing.push('Member Name');
                    if (!signup.phone?.trim()) signupMissing.push('Phone');
                    if (!signup.email?.trim()) signupMissing.push('Email');
                    if (!signup.dogName?.trim()) signupMissing.push('Dog Name');
                    if (!signup.dogBreed?.trim()) signupMissing.push('Dog Breed');
                    if (!signup.myTimeLink?.trim()) signupMissing.push('MyTime Profile Link');
                    
                    if (signupMissing.length > 0) {
                        missingFields.push(`Sign-up #${signupNum}: ${signupMissing.join(', ')}`);
                    } else {
                        validSignups.push(signup);
                    }
                });

                if (missingFields.length > 0) {
                    alert('Please fill in all required fields:\n\n' + missingFields.join('\n'));
                    return;
                }

                if (validSignups.length === 0) {
                    alert('Please add at least one complete sign-up.');
                    return;
                }

                try {
                    const entryToSave = {
                        ...currentEntry,
                        teamMember: teamMemberName,
                        signups: validSignups,
                        createdAt: new Date().toISOString()
                    };

                    if (editingEntry) {
                        const docRef = window.firestoreDoc(window.firebaseDB, 'presales_entries', editingEntry.id);
                        await window.firestoreDeleteDoc(docRef);
                        await window.firestoreAddDoc(window.firestoreCollection(window.firebaseDB, 'presales_entries'), entryToSave);
                        setEditingEntry(null);
                    } else {
                        await window.firestoreAddDoc(window.firestoreCollection(window.firebaseDB, 'presales_entries'), entryToSave);
                    }

                    await loadEntriesFromFirebase();
                    resetForm();
                    setShowForm(false);
                } catch (error) {
                    console.error('Error saving entry:', error);
                    alert('Error saving entry. Please try again.');
                }
            };

            const resetForm = () => {
                setCurrentEntry({
                    date: new Date().toISOString().split('T')[0],
                    teamMember: userName,
                    signups: [{ ...emptySignup }],
                    dailyReport: ''
                });
                setEditingEntry(null);
            };

            const editEntry = (entry) => {
                setCurrentEntry({
                    date: entry.date,
                    teamMember: entry.teamMember,
                    signups: entry.signups,
                    dailyReport: entry.dailyReport || ''
                });
                setEditingEntry(entry);
                setShowForm(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const deleteEntry = async (entryId) => {
                try {
                    const entry = entries.find(e => e.id === entryId);
                    setDeletedEntries(prev => [...prev, entry]);
                    setShowUndoToast(true);
                    
                    setTimeout(() => {
                        setShowUndoToast(false);
                        setDeletedEntries(prev => prev.filter(e => e.id !== entryId));
                    }, 10000);

                    const docRef = window.firestoreDoc(window.firebaseDB, 'presales_entries', entryId);
                    await window.firestoreDeleteDoc(docRef);
                    await loadEntriesFromFirebase();
                } catch (error) {
                    console.error('Error deleting entry:', error);
                    alert('Error deleting entry. Please try again.');
                }
            };

            const undoDelete = async () => {
                if (deletedEntries.length === 0) return;
                
                try {
                    const lastDeleted = deletedEntries[deletedEntries.length - 1];
                    const { id, ...entryData } = lastDeleted;
                    
                    await window.firestoreAddDoc(window.firestoreCollection(window.firebaseDB, 'presales_entries'), entryData);
                    
                    setDeletedEntries(prev => prev.slice(0, -1));
                    if (deletedEntries.length <= 1) {
                        setShowUndoToast(false);
                    }
                    await loadEntriesFromFirebase();
                } catch (error) {
                    console.error('Error restoring entry:', error);
                    alert('Error restoring entry. Please try again.');
                }
            };

            // Calculate totals
            const getTotalSignups = () => {
                return entries.reduce((sum, entry) => sum + entry.signups.length, 0);
            };

            const getTotalMembers = () => {
                const uniqueEmails = new Set();
                entries.forEach(entry => {
                    entry.signups.forEach(signup => {
                        if (signup.email) uniqueEmails.add(signup.email.toLowerCase());
                        else if (signup.phone) uniqueEmails.add(signup.phone);
                        else uniqueEmails.add(signup.memberName.toLowerCase());
                    });
                });
                return uniqueEmails.size;
            };

            const getTotalMRR = () => {
                return entries.reduce((sum, entry) => {
                    return sum + entry.signups.reduce((s, signup) => s + (tierPricing[signup.tier] || 0), 0);
                }, 0);
            };

            const getGoalProgress = () => {
                const total = getTotalSignups();
                return Math.min((total / goal) * 100, 100);
            };

            const getDaysUntilOpening = () => {
                if (!openingDate) return null;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const opening = new Date(openingDate);
                const diff = Math.ceil((opening - today) / (1000 * 60 * 60 * 24));
                return diff;
            };

            // Leaderboard data
            const getLeaderboardData = () => {
                const teamStats = {};
                
                entries.forEach(entry => {
                    const member = entry.teamMember;
                    if (!teamStats[member]) {
                        teamStats[member] = { signups: 0, members: new Set(), mrr: 0 };
                    }
                    
                    entry.signups.forEach(signup => {
                        teamStats[member].signups++;
                        teamStats[member].mrr += tierPricing[signup.tier] || 0;
                        
                        const memberId = signup.email?.toLowerCase() || signup.phone || signup.memberName.toLowerCase();
                        teamStats[member].members.add(memberId);
                    });
                });

                return Object.entries(teamStats)
                    .map(([name, stats]) => ({
                        name,
                        signups: stats.signups,
                        members: stats.members.size,
                        mrr: stats.mrr
                    }))
                    .sort((a, b) => {
                        if (leaderboardMetric === 'signups') return b.signups - a.signups;
                        if (leaderboardMetric === 'members') return b.members - a.members;
                        return b.mrr - a.mrr;
                    });
            };

            // Get all signups flat list
            const getAllSignups = () => {
                const allSignups = [];
                entries.forEach(entry => {
                    entry.signups.forEach(signup => {
                        allSignups.push({
                            ...signup,
                            date: entry.date,
                            teamMember: entry.teamMember,
                            entryId: entry.id
                        });
                    });
                });
                return allSignups.sort((a, b) => new Date(b.date) - new Date(a.date));
            };

            // Backup/Restore - JSON
            const downloadBackupJSON = () => {
                const backup = {
                    version: '1.0',
                    exportDate: new Date().toISOString(),
                    entries: entries,
                    settings: { goal, openingDate }
                };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sherwood_presales_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            // Backup - CSV
            const downloadBackupCSV = () => {
                const allSignups = getAllSignups();
                if (allSignups.length === 0) {
                    alert('No data to export.');
                    return;
                }

                const headers = ['Date', 'Member Name', 'Phone', 'Email', 'Dog Name', 'Breed', 'Breed Level', 'Tier', 'Monthly Price', 'MyTime Profile', 'Signed By'];
                const rows = allSignups.map(signup => [
                    signup.date,
                    signup.memberName,
                    signup.phone || '',
                    signup.email || '',
                    signup.dogName,
                    signup.dogBreed || '',
                    signup.dogBreedLevel || '',
                    signup.tier,
                    tierPricing[signup.tier] || '',
                    signup.myTimeLink || '',
                    signup.teamMember
                ]);

                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                ].join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sherwood_presales_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            const handleRestore = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    const text = await file.text();
                    const backup = JSON.parse(text);
                    
                    if (!backup.entries || !Array.isArray(backup.entries)) {
                        alert('Invalid backup file format');
                        return;
                    }

                    if (confirm(`This backup contains ${backup.entries.length} entries. Merge with existing data?`)) {
                        for (const entry of backup.entries) {
                            const { id, ...entryData } = entry;
                            await window.firestoreAddDoc(window.firestoreCollection(window.firebaseDB, 'presales_entries'), entryData);
                        }
                        
                        if (backup.settings) {
                            if (backup.settings.goal) {
                                setGoal(backup.settings.goal);
                                localStorage.setItem('presalesGoal', backup.settings.goal);
                            }
                            if (backup.settings.openingDate) {
                                setOpeningDate(backup.settings.openingDate);
                                localStorage.setItem('presalesOpeningDate', backup.settings.openingDate);
                            }
                        }
                        
                        await loadEntriesFromFirebase();
                        alert('Backup restored successfully!');
                    }
                } catch (error) {
                    console.error('Error restoring backup:', error);
                    alert('Error reading backup file.');
                }
                
                event.target.value = '';
            };

            const getTierBadgeClass = (tier) => {
                if (tier === 'Escentials') return 'tier-escentials';
                if (tier === 'Escentials+') return 'tier-escentials-plus';
                return 'tier-unlimited';
            };

            const getLevelBadgeClass = (level) => {
                if (level === 1) return 'level-1';
                if (level === 2) return 'level-2';
                return 'level-3';
            };

            if (loading) {
                return <div className="container" style={{ textAlign: 'center', padding: '50px' }}>Loading...</div>;
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>🐾 SHERWOOD PRE-SALES TRACKER 🐾</h1>
                        <div className="subtitle">Membership Sign-ups Before Grand Opening</div>
                    </div>

                    {/* Goal Progress & Countdown */}
                    <div style={{ display: 'grid', gridTemplateColumns: openingDate ? '2fr 1fr' : '1fr', gap: '20px', marginBottom: '20px' }}>
                        <div className="goal-container">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <h3 style={{ margin: 0, color: '#0077B6' }}>🎯 Pre-Sale Goal: {goal} Memberships</h3>
                                <button onClick={() => setShowSettings(!showSettings)} className="btn" style={{ padding: '8px 16px', background: '#6b7280' }}>
                                    ⚙️ Settings
                                </button>
                            </div>
                            <div className="progress-bar-container">
                                <div className="progress-bar" style={{ width: `${getGoalProgress()}%` }}>
                                    {getTotalSignups()} / {goal} ({getGoalProgress().toFixed(1)}%)
                                </div>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-around', textAlign: 'center', marginTop: '15px' }}>
                                <div>
                                    <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#0077B6' }}>{getTotalSignups()}</div>
                                    <div style={{ fontSize: '0.9em', color: '#666' }}>Total Sign-ups</div>
                                </div>
                                <div>
                                    <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#FF6B35' }}>{getTotalMembers()}</div>
                                    <div style={{ fontSize: '0.9em', color: '#666' }}>Unique Members</div>
                                </div>
                                <div>
                                    <div style={{ fontSize: '1.8em', fontWeight: 'bold', color: '#22c55e' }}>${getTotalMRR()}</div>
                                    <div style={{ fontSize: '0.9em', color: '#666' }}>Monthly MRR</div>
                                </div>
                            </div>
                        </div>

                        {openingDate && (
                            <div className="countdown-box">
                                <div style={{ fontSize: '0.9em', opacity: 0.9 }}>Days Until Opening</div>
                                <div className="countdown-number">
                                    {getDaysUntilOpening() > 0 ? getDaysUntilOpening() : '🎉'}
                                </div>
                                <div style={{ fontSize: '0.9em', opacity: 0.9 }}>
                                    {getDaysUntilOpening() > 0 ? new Date(openingDate).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : "It's Opening Day!"}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Settings Panel */}
                    {showSettings && (
                        <div className="form-box" style={{ marginBottom: '20px' }}>
                            <h3 style={{ color: '#0077B6', marginTop: 0 }}>⚙️ Settings</h3>
                            <div className="form-grid">
                                <div>
                                    <label className="form-label">Pre-Sale Goal</label>
                                    <input
                                        type="number"
                                        value={goal}
                                        onChange={(e) => {
                                            const val = parseInt(e.target.value) || 250;
                                            setGoal(val);
                                            localStorage.setItem('presalesGoal', val);
                                        }}
                                        className="form-input"
                                    />
                                </div>
                                <div>
                                    <label className="form-label">Grand Opening Date</label>
                                    <input
                                        type="date"
                                        value={openingDate}
                                        onChange={(e) => {
                                            setOpeningDate(e.target.value);
                                            localStorage.setItem('presalesOpeningDate', e.target.value);
                                        }}
                                        className="form-input"
                                    />
                                </div>
                            </div>
                            <div style={{ marginTop: '20px', paddingTop: '20px', borderTop: '2px solid #e0e0e0' }}>
                                <h4 style={{ color: '#0077B6', marginBottom: '15px' }}>📁 Backup & Restore</h4>
                                <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                                    <button onClick={downloadBackupJSON} className="btn" style={{ background: '#22c55e' }}>
                                        💾 Download JSON Backup
                                    </button>
                                    <button onClick={downloadBackupCSV} className="btn" style={{ background: '#3b82f6' }}>
                                        📊 Download CSV (Excel)
                                    </button>
                                    <button onClick={() => fileInputRef.current?.click()} className="btn" style={{ background: '#8b5cf6' }}>
                                        📂 Restore from JSON
                                    </button>
                                    <input
                                        type="file"
                                        ref={fileInputRef}
                                        onChange={handleRestore}
                                        accept=".json"
                                        style={{ display: 'none' }}
                                    />
                                </div>
                                <p style={{ fontSize: '0.85em', color: '#666', marginTop: '10px' }}>
                                    💡 <strong>JSON</strong> backup can be restored later. <strong>CSV</strong> is for viewing in Excel/Google Sheets.
                                </p>
                            </div>
                        </div>
                    )}

                    {/* View Tabs */}
                    <div className="view-tabs">
                        <button className={`tab ${view === 'dashboard' ? 'active' : ''}`} onClick={() => setView('dashboard')}>
                            📊 Dashboard
                        </button>
                        <button className={`tab ${view === 'entries' ? 'active' : ''}`} onClick={() => setView('entries')}>
                            📝 Daily Entries
                        </button>
                        <button className={`tab ${view === 'signups' ? 'active' : ''}`} onClick={() => setView('signups')}>
                            🐕 All Sign-ups
                        </button>
                        <button className={`tab ${view === 'leaderboard' ? 'active' : ''}`} onClick={() => setView('leaderboard')}>
                            🏆 Leaderboard
                        </button>
                    </div>

                    {/* Add Sign-ups Button & User Name */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '15px' }}>
                        <button 
                            onClick={() => { resetForm(); setShowForm(!showForm); }} 
                            className={`btn ${showForm ? 'btn-cancel' : 'btn-secondary'}`}
                        >
                            {showForm ? '✕ Cancel' : '+ Add Sign-ups'}
                        </button>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <label className="form-label" style={{ margin: 0 }}>Your Name:</label>
                            <input
                                type="text"
                                value={userName}
                                onChange={(e) => {
                                    setUserName(e.target.value);
                                    localStorage.setItem('presalesUserName', e.target.value);
                                }}
                                className="form-input"
                                placeholder="Enter your name"
                                style={{ width: '180px' }}
                            />
                        </div>
                    </div>

                    {/* Undo Toast */}
                    {showUndoToast && (
                        <div style={{
                            position: 'fixed',
                            bottom: '20px',
                            right: '20px',
                            background: '#333',
                            color: 'white',
                            padding: '15px 20px',
                            borderRadius: '8px',
                            boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '15px',
                            zIndex: 1000
                        }}>
                            <span>Entry deleted</span>
                            <button onClick={undoDelete} style={{ background: '#FF6B35', color: 'white', border: 'none', padding: '8px 16px', borderRadius: '4px', cursor: 'pointer', fontWeight: 600 }}>
                                Undo
                            </button>
                            <button onClick={() => setShowUndoToast(false)} style={{ background: 'transparent', color: 'white', border: 'none', cursor: 'pointer', fontSize: '1.2em' }}>
                                ✕
                            </button>
                        </div>
                    )}

                    {/* Entry Form */}
                    {showForm && (
                        <div className="form-box">
                            <h2 style={{ color: '#0077B6', marginTop: 0 }}>
                                {editingEntry ? '✏️ Edit Entry' : '📝 New Sign-up Entry'}
                            </h2>
                            
                            <div className="form-grid" style={{ marginBottom: '20px' }}>
                                <div>
                                    <label className="form-label">Date</label>
                                    <input
                                        type="date"
                                        value={currentEntry.date}
                                        onChange={(e) => setCurrentEntry(prev => ({ ...prev, date: e.target.value }))}
                                        className="form-input"
                                    />
                                </div>
                                <div>
                                    <label className="form-label">Your Name</label>
                                    <input
                                        type="text"
                                        value={currentEntry.teamMember || userName}
                                        onChange={(e) => setCurrentEntry(prev => ({ ...prev, teamMember: e.target.value }))}
                                        className="form-input"
                                        placeholder="Enter your name"
                                    />
                                </div>
                            </div>

                            <h3 style={{ color: '#0077B6', borderBottom: '2px solid #00A0DC', paddingBottom: '10px' }}>
                                Sign-ups ({currentEntry.signups.length})
                            </h3>

                            {currentEntry.signups.map((signup, index) => (
                                <div key={index} className="signup-card">
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                                        <strong style={{ color: '#0077B6' }}>Sign-up #{index + 1}</strong>
                                        {currentEntry.signups.length > 1 && (
                                            <button onClick={() => removeSignupRow(index)} className="btn-danger" style={{ padding: '5px 10px', fontSize: '0.85em', border: 'none', borderRadius: '4px', cursor: 'pointer', color: 'white' }}>
                                                Remove
                                            </button>
                                        )}
                                    </div>
                                    <div className="form-grid">
                                        <div>
                                            <label className="form-label">Member Name <span style={{ color: '#ef4444' }}>*</span></label>
                                            <input
                                                type="text"
                                                value={signup.memberName}
                                                onChange={(e) => updateSignup(index, 'memberName', e.target.value)}
                                                className="form-input"
                                                placeholder="John Smith"
                                            />
                                        </div>
                                        <div>
                                            <label className="form-label">Phone <span style={{ color: '#ef4444' }}>*</span></label>
                                            <input
                                                type="tel"
                                                value={signup.phone}
                                                onChange={(e) => updateSignup(index, 'phone', e.target.value)}
                                                className="form-input"
                                                placeholder="(555) 123-4567"
                                            />
                                        </div>
                                        <div>
                                            <label className="form-label">Email <span style={{ color: '#ef4444' }}>*</span></label>
                                            <input
                                                type="email"
                                                value={signup.email}
                                                onChange={(e) => updateSignup(index, 'email', e.target.value)}
                                                className="form-input"
                                                placeholder="john@email.com"
                                            />
                                        </div>
                                        <div>
                                            <label className="form-label">Dog Name <span style={{ color: '#ef4444' }}>*</span></label>
                                            <input
                                                type="text"
                                                value={signup.dogName}
                                                onChange={(e) => updateSignup(index, 'dogName', e.target.value)}
                                                className="form-input"
                                                placeholder="Buddy"
                                            />
                                        </div>
                                        <div>
                                            <label className="form-label">
                                                Dog Breed <span style={{ color: '#ef4444' }}>*</span>
                                                {signup.dogBreedLevel && (
                                                    <span className={`level-badge ${getLevelBadgeClass(signup.dogBreedLevel)}`} style={{ marginLeft: '8px' }}>
                                                        Level {signup.dogBreedLevel}
                                                    </span>
                                                )}
                                            </label>
                                            <BreedAutocomplete
                                                value={signup.dogBreed}
                                                onChange={(val) => updateSignup(index, 'dogBreed', val)}
                                                onLevelChange={(level) => updateSignup(index, 'dogBreedLevel', level)}
                                            />
                                        </div>
                                        <div>
                                            <label className="form-label">Membership Tier <span style={{ color: '#ef4444' }}>*</span></label>
                                            <select
                                                value={signup.tier}
                                                onChange={(e) => updateSignup(index, 'tier', e.target.value)}
                                                className="form-input"
                                            >
                                                <option value="Escentials">Escentials ($29/mo)</option>
                                                <option value="Escentials+">Escentials+ ($39/mo)</option>
                                                <option value="Unlimited +">Unlimited + ($59/mo)</option>
                                            </select>
                                        </div>
                                        <div style={{ gridColumn: '1 / -1' }}>
                                            <label className="form-label">MyTime Profile Link <span style={{ color: '#ef4444' }}>*</span></label>
                                            <input
                                                type="url"
                                                value={signup.myTimeLink}
                                                onChange={(e) => updateSignup(index, 'myTimeLink', e.target.value)}
                                                className="form-input"
                                                placeholder="Paste MyTime profile URL here..."
                                            />
                                        </div>
                                    </div>
                                </div>
                            ))}

                            <button onClick={addSignupRow} className="btn" style={{ marginTop: '10px', marginBottom: '20px' }}>
                                + Add Another Dog
                            </button>

                            <div style={{ marginTop: '20px' }}>
                                <label className="form-label">Daily Notes (Optional)</label>
                                <textarea
                                    value={currentEntry.dailyReport}
                                    onChange={(e) => setCurrentEntry(prev => ({ ...prev, dailyReport: e.target.value }))}
                                    className="form-input"
                                    rows="3"
                                    placeholder="Any notes about today's sign-ups, events, or observations..."
                                />
                            </div>

                            <div style={{ display: 'flex', gap: '15px', marginTop: '25px' }}>
                                <button onClick={saveEntry} className="btn btn-success" style={{ flex: 1 }}>
                                    {editingEntry ? '💾 Update Entry' : '💾 Save Entry'}
                                </button>
                                <button onClick={() => { setShowForm(false); resetForm(); }} className="btn btn-cancel">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Dashboard View */}
                    {view === 'dashboard' && (
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '20px' }}>
                            {/* Tier Breakdown */}
                            <div style={{ background: 'white', padding: '25px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                                <h3 style={{ color: '#0077B6', marginTop: 0 }}>Tier Breakdown</h3>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '15px' }}>
                                    {Object.keys(tierPricing).map(tier => {
                                        const count = getAllSignups().filter(s => s.tier === tier).length;
                                        const revenue = count * tierPricing[tier];
                                        return (
                                            <div key={tier} style={{ textAlign: 'center', padding: '15px', background: '#f8f8f8', borderRadius: '8px' }}>
                                                <span className={`tier-badge ${getTierBadgeClass(tier)}`}>{tier}</span>
                                                <div style={{ fontSize: '1.8em', fontWeight: 'bold', marginTop: '10px' }}>{count}</div>
                                                <div style={{ color: '#666', fontSize: '0.9em' }}>${revenue}/mo</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Recent Activity */}
                            <div style={{ background: 'white', padding: '25px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
                                <h3 style={{ color: '#0077B6', marginTop: 0 }}>Recent Sign-ups</h3>
                                {getAllSignups().slice(0, 5).map((signup, idx) => (
                                    <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: '1px solid #e0e0e0' }}>
                                        <div>
                                            <strong>{signup.memberName}</strong> - {signup.dogName}
                                            {signup.dogBreedLevel && (
                                                <span className={`level-badge ${getLevelBadgeClass(signup.dogBreedLevel)}`} style={{ marginLeft: '6px', fontSize: '0.7em' }}>
                                                    L{signup.dogBreedLevel}
                                                </span>
                                            )}
                                            <div style={{ fontSize: '0.85em', color: '#666' }}>by {signup.teamMember} on {signup.date}</div>
                                        </div>
                                        <span className={`tier-badge ${getTierBadgeClass(signup.tier)}`}>{signup.tier}</span>
                                    </div>
                                ))}
                                {getAllSignups().length === 0 && (
                                    <p style={{ color: '#666', textAlign: 'center' }}>No sign-ups yet. Add your first one!</p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Daily Entries View */}
                    {view === 'entries' && (
                        <div>
                            {entries.length === 0 ? (
                                <div style={{ textAlign: 'center', padding: '50px', color: '#666' }}>
                                    <p style={{ fontSize: '1.2em' }}>No entries yet. Click "Add Sign-ups" to get started!</p>
                                </div>
                            ) : (
                                entries.map(entry => (
                                    <div key={entry.id} className="form-box" style={{ marginBottom: '20px' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '15px' }}>
                                            <div>
                                                <h3 style={{ margin: 0, color: '#0077B6' }}>{entry.date}</h3>
                                                <p style={{ margin: '5px 0 0 0', color: '#666' }}>by {entry.teamMember} • {entry.signups.length} sign-up(s)</p>
                                            </div>
                                            <div>
                                                <button onClick={() => editEntry(entry)} className="edit-btn">✏️ Edit</button>
                                                <button onClick={() => deleteEntry(entry.id)} className="delete-btn">🗑 Delete</button>
                                            </div>
                                        </div>
                                        
                                        <div style={{ display: 'grid', gap: '10px' }}>
                                            {entry.signups.map((signup, idx) => (
                                                <div key={idx} style={{ background: 'white', padding: '12px', borderRadius: '6px' }}>
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                        <div>
                                                            <strong>{signup.memberName}</strong> - {signup.dogName} 
                                                            ({signup.dogBreed || 'N/A'}
                                                            {signup.dogBreedLevel && (
                                                                <span className={`level-badge ${getLevelBadgeClass(signup.dogBreedLevel)}`} style={{ marginLeft: '4px', fontSize: '0.7em' }}>
                                                                    L{signup.dogBreedLevel}
                                                                </span>
                                                            )})
                                                            <div style={{ fontSize: '0.85em', color: '#666' }}>{signup.phone} • {signup.email}</div>
                                                            {signup.myTimeLink && (
                                                                <div style={{ fontSize: '0.85em', marginTop: '4px' }}>
                                                                    <a href={signup.myTimeLink} target="_blank" rel="noopener noreferrer" style={{ color: '#0077B6' }}>
                                                                        📋 MyTime Profile
                                                                    </a>
                                                                </div>
                                                            )}
                                                        </div>
                                                        <span className={`tier-badge ${getTierBadgeClass(signup.tier)}`}>{signup.tier}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {entry.dailyReport && (
                                            <div style={{ marginTop: '15px', padding: '12px', background: '#fff8f0', borderRadius: '6px', borderLeft: '3px solid #FF6B35' }}>
                                                <strong style={{ color: '#FF6B35' }}>Daily Report:</strong>
                                                <p style={{ margin: '5px 0 0 0', whiteSpace: 'pre-wrap' }}>{entry.dailyReport}</p>
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    )}

                    {/* All Sign-ups View */}
                    {view === 'signups' && (
                        <div style={{ overflowX: 'auto' }}>
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Member Name</th>
                                        <th>Phone</th>
                                        <th>Email</th>
                                        <th>Dog Name</th>
                                        <th>Breed</th>
                                        <th>Tier</th>
                                        <th>MyTime</th>
                                        <th>Signed By</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {getAllSignups().map((signup, idx) => (
                                        <tr key={idx}>
                                            <td>{signup.date}</td>
                                            <td><strong>{signup.memberName}</strong></td>
                                            <td>{signup.phone || '-'}</td>
                                            <td>{signup.email || '-'}</td>
                                            <td>{signup.dogName}</td>
                                            <td>
                                                {signup.dogBreed || '-'}
                                                {signup.dogBreedLevel && (
                                                    <span className={`level-badge ${getLevelBadgeClass(signup.dogBreedLevel)}`} style={{ marginLeft: '6px' }}>
                                                        L{signup.dogBreedLevel}
                                                    </span>
                                                )}
                                            </td>
                                            <td><span className={`tier-badge ${getTierBadgeClass(signup.tier)}`}>{signup.tier}</span></td>
                                            <td>
                                                {signup.myTimeLink ? (
                                                    <a href={signup.myTimeLink} target="_blank" rel="noopener noreferrer" style={{ color: '#0077B6' }}>
                                                        View
                                                    </a>
                                                ) : '-'}
                                            </td>
                                            <td>{signup.teamMember}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {getAllSignups().length === 0 && (
                                <p style={{ textAlign: 'center', color: '#666', padding: '30px' }}>No sign-ups yet.</p>
                            )}
                        </div>
                    )}

                    {/* Leaderboard View */}
                    {view === 'leaderboard' && (
                        <div>
                            <div style={{ marginBottom: '20px' }}>
                                <label className="form-label">Rank By:</label>
                                <select
                                    value={leaderboardMetric}
                                    onChange={(e) => setLeaderboardMetric(e.target.value)}
                                    className="form-input"
                                    style={{ width: 'auto', minWidth: '200px' }}
                                >
                                    <option value="signups">Total Sign-ups (Dogs)</option>
                                    <option value="members">Total Members (People)</option>
                                    <option value="mrr">Total MRR Generated</option>
                                </select>
                            </div>

                            {getLeaderboardData().length === 0 ? (
                                <p style={{ textAlign: 'center', color: '#666', padding: '30px' }}>No data yet. Start adding sign-ups!</p>
                            ) : (
                                getLeaderboardData().map((person, idx) => (
                                    <div key={person.name} className="leaderboard-item">
                                        <div className={`leaderboard-rank ${idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : ''}`}>
                                            {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}
                                        </div>
                                        <div style={{ flex: 1, marginLeft: '15px' }}>
                                            <div style={{ fontWeight: 600, fontSize: '1.1em' }}>{person.name}</div>
                                            <div style={{ fontSize: '0.9em', color: '#666' }}>
                                                {person.signups} sign-ups • {person.members} members • ${person.mrr}/mo MRR
                                            </div>
                                        </div>
                                        <div style={{ fontSize: '1.5em', fontWeight: 'bold', color: '#0077B6' }}>
                                            {leaderboardMetric === 'signups' && person.signups}
                                            {leaderboardMetric === 'members' && person.members}
                                            {leaderboardMetric === 'mrr' && `$${person.mrr}`}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}

                    <div style={{ textAlign: 'center', padding: '40px 20px', color: '#0077B6', marginTop: '40px' }}>
                        <span style={{ color: '#FF6B35', fontSize: '1.5em' }}>🐾</span>
                        <strong> SCENTHOUND SHERWOOD</strong> - Coming Soon!
                        <span style={{ color: '#FF6B35', fontSize: '1.5em' }}> 🐾</span>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<PreSalesTracker />, document.getElementById('root'));
    </script>
</body>
</html>
